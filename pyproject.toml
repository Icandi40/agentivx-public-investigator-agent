[project]
name = "public-investigator-agent"
version = "0.1.0"
description = "Python agent that answers investigative questions over the public OFAC SDN list, with a measured eval harness"
readme = "README.md"
authors = [
    { name = "Sheena Lindsey-Smith" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "fastembed>=0.9.1",
    "langgraph>=1.2.22",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-networkx>=3.6.1.20261117",
]

[tool.uv.build-backend]
module-name = "investigator"

[project.scripts]
investigator = "investigator.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "evals", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
